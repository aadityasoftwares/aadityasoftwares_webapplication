<header class="app-site-header">
  <div class="header-container">
    <!-- Brand Logo -->
    <a href="#home" class="header-brand" (click)="onNavClick(navItems[0], $event)" aria-label="AadityaSoftwares Home">
      <div class="brand-logo-badge">
        <img
          src="/companylogos/AadityaSoftwaresLogo.png"
          alt="AadityaSoftwares"
          class="header-brand-logo-img"
        />
      </div>
      <div class="brand-logo-text">
        <span class="brand-main">Aaditya</span><span class="brand-highlight">Softwares</span>
      </div>
    </a>

    <!-- Desktop Navigation with Icons -->
    <nav class="desktop-navigation" aria-label="Main Navigation">
      <ul class="nav-list">
        @for (item of navItems; track item.label) {
          <li class="nav-item">
            <a
              [href]="item.href"
              class="nav-link"
              [class.is-active]="activePath() === item.label"
              (click)="onNavClick(item, $event)"
            >
              <app-icon [icon]="item.icon" size="sm" class="nav-item-icon" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Desktop CTA Action (app-button with square-rounded radius) -->
    <div class="header-actions">
      <app-button
        variant="primary"
        size="sm"
        [iconRight]="LucideArrowRight"
        (buttonClick)="onSignup($event)"
      >
        Signup
      </app-button>

      <!-- Mobile Menu Toggle -->
      <button
        type="button"
        class="mobile-menu-btn"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMobileMenu()"
      >
        <app-icon [icon]="mobileMenuOpen() ? LucideX : LucideMenu" size="md" />
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu with Icons -->
  @if (mobileMenuOpen()) {
    <div class="mobile-drawer" role="dialog" aria-modal="true">
      <nav class="mobile-nav">
        @for (item of navItems; track item.label) {
          <a
            [href]="item.href"
            class="mobile-nav-link"
            [class.is-active]="activePath() === item.label"
            (click)="onNavClick(item, $event)"
          >
            <app-icon [icon]="item.icon" size="sm" class="mobile-nav-icon" />
            <span>{{ item.label }}</span>
          </a>
        }
        <div class="mobile-action">
          <app-button
            variant="primary"
            size="md"
            [fullWidth]="true"
            [iconRight]="LucideArrowRight"
            (buttonClick)="onSignup($event)"
          >
            Signup
          </app-button>
        </div>
      </nav>
    </div>
  }
</header>
