<aside class="quick-contact-dock" aria-label="Quick contact shortcuts">
  <!-- Email Shortcut -->
  <a
    [href]="emailUrl"
    class="quick-contact-btn email-btn"
    aria-label="Send email to contact@aadityasoftwares.in"
  >
    <span class="btn-badge" aria-hidden="true">Email Us</span>
    <div class="btn-circle">
      <app-icon [icon]="LucideMail" size="md" />
    </div>
  </a>

  <!-- Phone Shortcut -->
  <a
    [href]="phoneUrl"
    class="quick-contact-btn phone-btn"
    aria-label="Call +91 88498 63872"
  >
    <span class="btn-badge" aria-hidden="true">+91 88498 63872</span>
    <div class="btn-circle">
      <app-icon [icon]="LucidePhone" size="md" />
    </div>
  </a>

  <!-- WhatsApp Shortcut -->
  <a
    [href]="whatsappUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="quick-contact-btn whatsapp-btn"
    aria-label="Chat with Aaditya Softwares on WhatsApp"
  >
    <span class="btn-badge" aria-hidden="true">Chat on WhatsApp</span>
    <div class="btn-circle">
      <svg class="whatsapp-svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
